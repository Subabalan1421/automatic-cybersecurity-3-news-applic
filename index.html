<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CyberGlow Digest</title>
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6b46c1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#faf5ff',
              100: '#f3e8ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans pb-12 select-none">

  <!-- Main Container -->
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col justify-between">
    
    <div>
      <!-- Header Banner -->
      <header class="bg-gradient-to-r from-brand-700 to-brand-900 text-white p-5 rounded-b-3xl shadow-md">
        <div class="flex items-center justify-between">
          <h1 class="text-2xl font-black tracking-wider uppercase">CyberGlow</h1>
          <span id="status-badge" class="text-xs px-2.5 py-1 rounded-full font-medium bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
            Checking...
          </span>
        </div>
        <p id="greeting-text" class="text-sm text-purple-200 mt-2 font-medium">Good day</p>
        <p id="current-date" class="text-xs text-purple-300"></p>
      </header>

      <!-- Content Area -->
      <main class="p-4 space-y-5">

        <!-- Holidays Section -->
        <section class="bg-purple-50/60 border border-purple-100 rounded-2xl p-4">
          <div class="flex items-center gap-2 mb-2">
            <span class="bg-brand-600 text-white text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md">Holidays</span>
          </div>
          <p id="holiday-info" class="text-xs text-slate-600 font-medium">No major public holidays observed today.</p>
        </section>

        <!-- Cybersecurity News (Top 3) -->
        <section class="space-y-3">
          <div class="flex items-center justify-between border-b pb-1.5 border-slate-200">
            <span class="bg-brand-600 text-white text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-md">
              Cybersecurity News
            </span>
            <span class="text-[11px] text-slate-400 font-semibold">Top 3</span>
          </div>
          <div id="cyber-news-list" class="space-y-3">
            <!-- News items injected via app.js -->
            <div class="animate-pulse space-y-2">
              <div class="h-4 bg-slate-200 rounded w-3/4"></div>
              <div class="h-3 bg-slate-100 rounded w-full"></div>
            </div>
          </div>
        </section>

        <!-- Exams & Opportunities (Top 3) -->
        <section class="space-y-3">
          <div class="flex items-center justify-between border-b pb-1.5 border-slate-200">
            <span class="bg-brand-600 text-white text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-md">
              Exams & Opportunities
            </span>
            <span class="text-[11px] text-slate-400 font-semibold">Top 3</span>
          </div>
          <ul id="exams-list" class="space-y-2 text-xs">
            <!-- Exam items injected via app.js -->
          </ul>
        </section>

        <!-- Practice & CTF Banner -->
        <section class="bg-gradient-to-r from-brand-600 to-brand-800 text-white p-4 rounded-2xl shadow-sm text-center">
          <h3 class="font-bold text-sm">Practice CTF Challenges</h3>
          <p class="text-xs text-purple-200 mt-1">Sharpen your cybersecurity skills with practical labs.</p>
          <a href="https://play.picoctf.org/" target="_blank" rel="noopener noreferrer" class="inline-block mt-3 bg-white text-brand-700 font-semibold text-xs px-4 py-1.5 rounded-full shadow hover:bg-purple-50 transition">
            Launch picoCTF &rarr;
          </a>
        </section>

      </main>
    </div>

    <!-- Footer -->
    <footer class="text-center text-[11px] text-slate-400 p-4 border-t border-slate-100">
      <p id="last-sync-time">Last updated: Never</p>
      <p class="mt-0.5">&copy; CyberGlow Daily Digest</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
